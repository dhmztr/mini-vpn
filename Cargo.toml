[package]
name = "mini-vpn"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chacha20 = "0.10.2"
chacha20poly1305 = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hkdf = "0.13.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tun2 = { version = "4.0.0", features = ["async"] }
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
